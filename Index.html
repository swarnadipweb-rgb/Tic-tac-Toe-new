<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sajal Singara — Modern Glass UI (Hardened)</title>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1724;
    --glass: rgba(255,255,255,0.06);
    --glass-2: rgba(255,255,255,0.08);
    --accent:#ff9a3c;
    --accent-dark:#ff6b00;
    --muted: #cbd5e1;
  }
  *{box-sizing:border-box}
  html,body{
    height:100%;margin:0;font-family:'Poppins',system-ui,Arial;
    background:
    radial-gradient(1000px 500px at 10% 10%, rgba(255,122,38,0.08), transparent 8%),
    radial-gradient(800px 400px at 90% 90%, rgba(255,106,0,0.06), transparent 10%),
    linear-gradient(180deg,#061021 0%, #071226 60%);
    color:#fff; -webkit-font-smoothing:antialiased;
    animation: pageFade 1s ease both;
  }

  .wrap{max-width:980px;margin:24px auto;padding:20px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:12px}

  .logo { width:56px;height:56px;border-radius:12px;
    background: linear-gradient(135deg,var(--accent),var(--accent-dark));
    display:flex;align-items:center;justify-content:center;font-weight:700;
    color:#0b1220;font-size:22px;
    box-shadow:0 8px 30px rgba(255,106,0,0.12);
    animation: floatEmoji 4s ease-in-out infinite;
  }

  .hero{
    border-radius:16px;padding:22px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
    backdrop-filter: blur(8px) saturate(120%);
    box-shadow: 0 8px 40px rgba(2,6,23,0.6);
    display:flex;gap:18px;align-items:center;overflow:hidden;
    animation: heroSlide 1.1s ease both;
  }

  .hero .left{flex:1}
  .hero h2{margin:0;font-size:22px}
  .hero p{color:var(--muted);margin:8px 0 0;font-size:14px}
  .hero .thumb{width:220px;height:140px;border-radius:12px;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;animation: softZoom 5s ease-in-out infinite;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:18px;margin-top:18px;
  }

  .card{
    border-radius:14px;padding:12px;
    background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
    backdrop-filter:blur(6px);transition:transform .22s ease;
    position:relative;opacity:0;
    animation: fadeUp 1s ease forwards;
  }
  .card:hover{transform:translateY(-6px);box-shadow:0 0 25px rgba(255,150,50,0.35)}

  .media{height:150px;border-radius:10px;overflow:hidden}
  .media img{width:100%;height:100%;object-fit:cover;transition: transform .4s}
  .card:hover .media img{transform:scale(1.06)}

  .badge{
    position:absolute;left:12px;top:12px;
    background:linear-gradient(90deg,var(--accent),var(--accent-dark));
    padding:6px 10px;border-radius:20px;
    font-size:13px;color:#071226;font-weight:700
  }

  h3{margin:12px 0 6px;font-size:18px}
  .desc{color:var(--muted);font-size:13px;margin-bottom:8px}

  .actions{display:flex;gap:8px;margin-top:10px}

  .btn{
    flex:1;padding:16px !important;
    font-size:20px !important;
    font-weight:800 !important;
    letter-spacing:.5px !important;
    border-radius:18px !important;
    text-transform:uppercase !important;
    background:linear-gradient(90deg,var(--accent),var(--accent-dark));
    color:#071226;border:none;cursor:pointer;
    box-shadow:0 6px 22px rgba(255,120,0,.35);
    transition:transform .22s;
    position:relative;
    overflow:hidden;
  }

  .btn:hover{transform:scale(1.04)}
  .btn:active{transform:scale(.92)}

  .btn::after{
    content:"";
    position:absolute;top:50%;left:50%;
    width:0;height:0;border-radius:50%;
    background:rgba(255,255,255,.35);
    transform:translate(-50%,-50%);
    opacity:0;transition:.4s;
  }
  .btn:active::after{
    width:180px;height:180px;opacity:1;
  }

  .btn.ghost{
    background:transparent;color:var(--muted);
    border:1px solid rgba(255,255,255,0.06)
  }

  .modal-wrap{
    position:fixed;inset:0;display:none;
    align-items:center;justify-content:center;padding:18px;z-index:100
  }
  .modal{
    width:100%;max-width:420px;background:rgba(255,255,255,0.04);
    padding:14px;border-radius:12px;backdrop-filter:blur(8px)
  }
  label{display:block;margin-top:10px;font-size:13px;color:var(--muted)}
  input,select{
    width:100%;padding:10px;border-radius:8px;background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.06);color:#fff
  }
  .hint{font-size:12px;color:var(--muted);margin-top:6px}

  /* ----------------------- */
  /* ⭐ ANIMATIONS ADDED ⭐ */
  /* ----------------------- */

  @keyframes fadeUp {
    from {opacity:0;transform:translateY(20px);}
    to {opacity:1;transform:translateY(0);}
  }
  @keyframes softZoom {
    0% {transform:scale(1);}
    50% {transform:scale(1.07);}
    100% {transform:scale(1);}
  }
  @keyframes heroSlide {
    from {opacity:0;transform:translateY(-20px);}
    to {opacity:1;transform:translateY(0);}
  }
  @keyframes floatEmoji {
    0%,100% {transform:translateY(0);}
    50% {transform:translateY(-10px);}
  }
  @keyframes pageFade {
    from {opacity:0}
    to {opacity:1}
  }
</style>
</head>
<body>

<div class="wrap">
<header>
  <div class="brand">
    <div class="logo">🍟</div>
    <div>
      <h1>Sajal Singara</h1>
      <p>Godhouli Bazar — Fresh & Tasty</p>
    </div>
  </div>
</header>

<section class="hero">
  <div class="left">
    <h2>তাজা ও মচমচে সিঙ্গারা</h2>
    <p>হাতে ভাজা — একবার খেলেই বুঝবেন!</p>
  </div>
  <div class="thumb"><img src="images/banner.jpeg" alt="banner"></div>
</section>

<div id="products" class="grid">

  <!-- VEG -->
  <div class="card">
    <div class="media">
      <img src="https://i.ibb.co/jvL3Dddr/photo.webp" alt="veg">
    </div>
    <div class="badge">Popular</div>
    <h3>ভেজ সিঙ্গারা</h3>
    <div class="desc">হালকা মশলা, খাস্তা ও সুস্বাদু।</div>
    <div class="actions">
      <button class="btn" onclick="openOrder('ভেজ সিঙ্গারা',10)">Order</button>
    </div>
  </div>

  <!-- CHICKEN -->
  <div class="card">
    <div class="media">
      <img src="https://i.ibb.co/KjCyqpk9/samosa.jpg" alt="chicken">
    </div>
    <div class="badge">New</div>
    <h3>চিকেন সিঙ্গারা</h3>
    <div class="desc">ঝাল–ঝাল মশলায় দারুন স্বাদ।</div>
    <div class="actions">
      <button class="btn" onclick="openOrder('চিকেন সিঙ্গারা',20)">Order</button>
    </div>
  </div>

</div>

</div>

<!-- Order Modal -->
<div id="modalWrap" class="modal-wrap" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="modalTitle">অর্ডার ফর্ম</h3>

    <label for="itemName">পণ্য</label>
    <input id="itemName" readonly>

    <label for="quantity">পরিমাণ</label>
    <input id="quantity" type="number" value="1" min="1" max="99">

    <label for="itemPrice">দাম (প্রতি)</label>
    <input id="itemPrice" readonly>

    <label for="custName">নাম</label>
    <input id="custName" placeholder="নাম লিখুন">

    <label for="custPhone">মোবাইল</label>
    <input id="custPhone" placeholder="01XXXXXXXXX">

    <label for="pickupTime">পিকআপ সময়</label>
    <input id="pickupTime" type="time">

    <label for="paymentMethod">পেমেন্ট</label>
    <select id="paymentMethod" aria-label="payment method">
      <option value="cash">Cash</option>
      <option value="online">Online</option>
    </select>

    <div class="hint">অনলাইনে পেমেন্ট করলে UPI অ্যাপ খুলবে।</div>

    <div class="actions" style="margin-top:12px">
      <button class="btn" onclick="sendWhatsApp()">Send</button>
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
/* ------------- your JS untouched ------------- */

const WHATSAPP_NUMBER = "919679957218";
const UPI_ID = "biswasdilipkumar795-1@okaxis";

function sanitizeText(s) {
  if (!s && s !== '') return '';
  s = String(s).replace(/[\x00-\x1F\x7F]/g, '').trim();
  return s.replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .slice(0, 200);
}

function isValidPhone(p) {
  if (!p) return false;
  p = String(p).replace(/[^\d+]/g, '');
  const digits = p.replace(/\D/g, '');
  return digits.length >= 10 && digits.length <= 15;
}

function toNumberSafe(v, fallback=0) {
  const n = Number(v);
  return Number.isFinite(n) ? n : fallback;
}

const modalWrap = document.getElementById('modalWrap');
const itemName = document.getElementById('itemName');
const quantity = document.getElementById('quantity');
const itemPrice = document.getElementById('itemPrice');
const custName = document.getElementById('custName');
const custPhone = document.getElementById('custPhone');
const pickupTime = document.getElementById('pickupTime');
const paymentMethod = document.getElementById('paymentMethod');

function openOrder(name, price){
  modalWrap.style.display = "flex";
  modalWrap.setAttribute('aria-hidden','false');
  itemName.value = sanitizeText(name);
  itemPrice.value = String(toNumberSafe(price,0));
  quantity.value = 1;
  custName.value = "";
  custPhone.value = "";
  pickupTime.value = "";
  paymentMethod.value = "cash";
}

function closeModal(){
  modalWrap.style.display = "none";
  modalWrap.setAttribute('aria-hidden','true');
}

function makeUPIPayment(amount) {
  amount = Number(amount);
  if (!Number.isFinite(amount) || amount <= 0) {
    alert('অবৈধ পরিমাণ');
    return false;
  }
  const amtStr = amount % 1 === 0 ? String(Math.round(amount)) : amount.toFixed(2);
  const upiUrl = `upi://pay?pa=${encodeURIComponent(UPI_ID)}&pn=Sajal%20Singara&am=${amtStr}&cu=INR`;
  window.location.href = upiUrl;
}

function makeMessage({item, qty, price, name, phone, pickup, payment}){
  const total = qty * price;
  return (
`✨ *নতুন অর্ডার পাওয়া গেছে!* ✨

📦 *পণ্য:* ${item}
🔢 *পরিমাণ:* ${qty} টি
💰 *দাম:* ${price}৳ × ${qty}
💵 *মোট:* ${total}৳

👤 *গ্রাহক:* ${name}
📞 *মোবাইল:* ${phone}
⏱️ *পিকআপ:* ${pickup || "—"}
💳 *পেমেন্ট:* ${payment}

🍟 *Sajal Singara*`
  );
}

function sendWhatsApp(){
  const qty = toNumberSafe(quantity.value,1);
  const price = toNumberSafe(itemPrice.value,0);
  const name = custName.value.trim();
  const phone = custPhone.value.trim();
  const pickup = pickupTime.value.trim();
  const payment = paymentMethod.value;

  if (!name){alert("নাম লিখুন");return;}
  if (!isValidPhone(phone)){alert("ফোন নম্বর ভুল");return;}

  if (payment === "online") {
    makeUPIPayment(qty * price);
  }

  const msg = makeMessage({
    item:itemName.value,
    qty, price, name, phone, pickup, payment
  });

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url,"_blank");
  closeModal();
}

modalWrap.addEventListener('click', e=>{
  if (e.target === modalWrap) closeModal();
});
</script>

</body>
</html>
